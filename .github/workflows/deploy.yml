name: Fabric CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and item definitions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh

      - name: Validate import payload
        run: bash scripts/import_workspace.sh --env dev --source fabric

  deploy-dev:
    name: Deploy to development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl jq
          sudo apt-get install -y -qq curl
          sudo apt-get install -y -qq jq

      - name: Import item definitions
        run: bash scripts/import_workspace.sh --env dev --source fabric --dry-run
        env:
          FABRIC_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_WORKSPACE_NAME: ${{ vars.FABRIC_WORKSPACE_NAME }}

  deploy-test:
    name: Deploy to test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-dev
    runs-on: ubuntu-24.04
    environment:
      name: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl jq

      - name: Import item definitions
        run: bash scripts/import_workspace.sh --env test --source fabric
        env:
          FABRIC_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_WORKSPACE_NAME: ${{ vars.FABRIC_WORKSPACE_NAME }}

  deploy-prod:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-test
    runs-on: ubuntu-24.04
    environment:
      name: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl jq

      - name: Import item definitions
        run: bash scripts/import_workspace.sh --env prod --source fabric
        env:
          FABRIC_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_WORKSPACE_NAME: ${{ vars.FABRIC_WORKSPACE_NAME }}
